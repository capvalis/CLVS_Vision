name: Rebuild verified raw dataset archives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dataset: [HERIDAL, HIT-UAV, TNO, military_object_dataset]
    steps:
      - uses: actions/checkout@v4
      - name: Build the snapshot's Zstandard version
        run: |
          curl --fail --location --retry 3 https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz | tar -xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/zstd-1.5.7" -j2 zstd
          echo "$RUNNER_TEMP/zstd-1.5.7/programs" >> "$GITHUB_PATH"
      - name: Download public sources and rebuild the exact local archive
        env:
          DATASET: ${{ matrix.dataset }}
        run: python3 .github/scripts/rebuild_dataset_archive.py "$DATASET" --output "$RUNNER_TEMP/archive"
      - name: Upload verified parts to the dataset release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload raw-datasets-2026-11-11 "$RUNNER_TEMP/archive/"*.part* --clobber
